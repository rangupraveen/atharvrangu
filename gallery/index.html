<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Atharv's Sports & Activities</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --yellow: #FFD93D; --orange: #FF6B35; --pink: #FF6B9D; --green: #06D6A0;
    --blue: #4CC9F0; --purple: #7B5EA7; --red: #EF233C; --bg: #FFF8F0; --text: #1A1A2E;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Nunito', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; padding: 24px; }
  a { text-decoration: none; color: inherit; }

  .back-link {
    display: inline-block; margin-bottom: 20px; font-family: 'Fredoka One', cursive; font-size: 16px;
    color: var(--orange); border: 3px solid var(--text); border-radius: 12px; padding: 8px 18px;
    background: white; box-shadow: 3px 3px 0 var(--text); transition: transform 0.1s, box-shadow 0.1s;
  }
  .back-link:hover { transform: translate(-2px, -2px); box-shadow: 5px 5px 0 var(--text); }

  .header { text-align: center; margin-bottom: 36px; }
  .header-badge {
    display: inline-block; background: var(--yellow); border: 4px solid var(--text); border-radius: 50px;
    padding: 6px 22px; font-family: 'Fredoka One', cursive; font-size: 14px; letter-spacing: 2px;
    text-transform: uppercase; margin-bottom: 10px; box-shadow: 3px 3px 0 var(--text);
  }
  h1 { font-family: 'Fredoka One', cursive; font-size: 46px; line-height: 1.1; text-shadow: 4px 4px 0 var(--yellow); }
  .subtitle { font-size: 16px; font-weight: 700; color: #666; margin-top: 8px; }

  .container { max-width: 920px; margin: 0 auto; }

  .sport {
    border: 4px solid var(--text); border-radius: 20px; overflow: hidden;
    box-shadow: 6px 6px 0 var(--text); margin-bottom: 36px; background: white;
  }
  .sport-header {
    display: flex; align-items: center; gap: 14px; padding: 16px 22px; border-bottom: 3px solid var(--text);
  }
  .sport-emoji { font-size: 34px; }
  .sport-title { font-family: 'Fredoka One', cursive; font-size: 26px; flex: 1; }
  .sport-tag { font-size: 13px; font-weight: 700; color: #777; }
  .sport-body { padding: 20px 22px 24px; }

  .block-label {
    font-family: 'Fredoka One', cursive; font-size: 15px; margin: 4px 0 12px; display: flex; align-items: center; gap: 8px;
  }

  /* Video grid (responsive 16:9) */
  .videos { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; margin-bottom: 22px; }
  .video-wrap {
    position: relative; width: 100%; padding-top: 56.25%; border: 3px solid var(--text);
    border-radius: 12px; overflow: hidden; background: #000;
  }
  .video-wrap iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }

  /* Photo grid */
  .photos { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; margin-bottom: 20px; }
  .photo {
    border: 3px solid var(--text); border-radius: 12px; overflow: hidden; aspect-ratio: 1 / 1;
    background: #eee; box-shadow: 3px 3px 0 var(--text);
  }
  .photo img { width: 100%; height: 100%; object-fit: cover; display: block; }

  .empty {
    border: 3px dashed #ccc; border-radius: 12px; padding: 22px; text-align: center;
    font-weight: 700; color: #aaa; font-size: 14px; margin-bottom: 20px;
  }

  .album-btn {
    display: inline-block; background: var(--text); color: white; font-family: 'Fredoka One', cursive;
    font-size: 15px; padding: 10px 22px; border-radius: 10px; transition: background 0.2s;
  }
  .album-btn:hover { background: var(--orange); }
  .album-btn.disabled { background: #ddd; color: #999; pointer-events: none; }

  .footer { text-align: center; margin-top: 36px; font-family: 'Fredoka One', cursive; font-size: 14px; color: #bbb; }
</style>
</head>
<body>

<a href="/" class="back-link">&larr; Back to Home</a>

<div class="header">
  <div class="header-badge">Sports &amp; Activities</div>
  <h1>Atharv in Action</h1>
  <p class="subtitle">Photos &amp; videos from the court, the field, and the pool! 🏀⚽🏊</p>
</div>

<div class="container" id="container"></div>

<div class="footer">More clips &amp; pics coming as Atharv keeps playing! 🎉</div>

<script>
/* =========================================================================
   ADD CONTENT HERE — just fill in each sport's videos, photos, and album.

   videos:  YouTube links or IDs, e.g. "https://youtu.be/AbC123" or "AbC123"
   photos:  image paths in /assets/gallery/<sport>/  e.g. "/assets/gallery/basketball/game1.jpg"
   album:   the Google Photos shared-album link for that sport ("" = hide button)
   ========================================================================= */
const sports = [
  {
    key: 'basketball', name: 'Basketball', emoji: '🏀', accent: '#FF6B35',
    tag: 'Dribbles, shots & buzzer-beaters',
    videos: [],   // e.g. ['https://youtu.be/XXXXXXXXXXX']
    photos: [],   // e.g. ['/assets/gallery/basketball/photo1.jpg']
    album: ''     // e.g. 'https://photos.app.goo.gl/XXXXXXXX'
  },
  {
    key: 'soccer', name: 'Soccer', emoji: '⚽', accent: '#06D6A0',
    tag: 'Goals, passes & footwork',
    videos: [],
    photos: [],
    album: ''
  },
  {
    key: 'swimming', name: 'Swimming', emoji: '🏊', accent: '#4CC9F0',
    tag: 'Laps, strokes & splashes',
    videos: [],
    photos: [],
    album: ''
  },
  {
    key: 'chess', name: 'Chess', emoji: '♟️', accent: '#7B5EA7',
    tag: 'Openings, tactics & checkmates',
    videos: [],
    photos: [],
    album: ''
  }
];

// Pull the 11-char video id out of any common YouTube URL form (or accept a bare id)
function ytId(v) {
  if (!v) return '';
  var m = v.match(/(?:youtu\.be\/|v=|embed\/|shorts\/)([A-Za-z0-9_-]{11})/);
  if (m) return m[1];
  if (/^[A-Za-z0-9_-]{11}$/.test(v)) return v;
  return '';
}

function buildSection(s) {
  var sec = document.createElement('section');
  sec.className = 'sport';
  sec.style.boxShadow = '6px 6px 0 ' + '#1A1A2E';

  var header = '<div class="sport-header" style="background:' + s.accent + '22">' +
    '<span class="sport-emoji">' + s.emoji + '</span>' +
    '<span class="sport-title">' + s.name + '</span>' +
    '<span class="sport-tag">' + s.tag + '</span></div>';

  var body = '<div class="sport-body">';

  // Videos
  var vids = (s.videos || []).map(ytId).filter(Boolean);
  if (vids.length) {
    body += '<div class="block-label">🎬 Videos</div><div class="videos">';
    vids.forEach(function(id) {
      body += '<div class="video-wrap"><iframe src="https://www.youtube.com/embed/' + id +
        '" title="' + s.name + ' video" loading="lazy" allowfullscreen ' +
        'allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"></iframe></div>';
    });
    body += '</div>';
  } else {
    body += '<div class="empty">🎬 Videos coming soon</div>';
  }

  // Photos
  var pics = s.photos || [];
  if (pics.length) {
    body += '<div class="block-label">📸 Photos</div><div class="photos">';
    pics.forEach(function(p) {
      var src = typeof p === 'string' ? p : p.src;
      body += '<a class="photo" href="' + src + '" target="_blank"><img src="' + src +
        '" alt="' + s.name + ' photo" loading="lazy"></a>';
    });
    body += '</div>';
  } else {
    body += '<div class="empty">📸 Photos coming soon</div>';
  }

  // Album link
  if (s.album) {
    body += '<a class="album-btn" href="' + s.album + '" target="_blank">See all ' + s.name + ' photos &rarr;</a>';
  } else {
    body += '<span class="album-btn disabled">Album link coming soon</span>';
  }

  body += '</div>';
  sec.innerHTML = header + body;
  return sec;
}

var container = document.getElementById('container');
sports.forEach(function(s) { container.appendChild(buildSection(s)); });
</script>
</body>
</html>
