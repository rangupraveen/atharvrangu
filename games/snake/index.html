<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Snake 🐍</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --yellow: #FFD93D; --orange: #FF6B35; --green: #06D6A0; --blue: #4CC9F0;
    --red: #EF233C; --bg: #FFF8F0; --text: #1A1A2E;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Nunito', sans-serif; background: var(--bg); color: var(--text);
    min-height: 100vh; padding: 16px; display: flex; flex-direction: column; align-items: center;
    -webkit-user-select: none; user-select: none;
  }
  a { text-decoration: none; color: inherit; }
  .topbar { width: 100%; max-width: 420px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .back-link { font-family: 'Fredoka One', cursive; font-size: 14px; color: var(--orange); border: 3px solid var(--text); border-radius: 12px; padding: 6px 14px; background: white; box-shadow: 3px 3px 0 var(--text); }
  .title { font-family: 'Fredoka One', cursive; font-size: 22px; text-shadow: 2px 2px 0 var(--yellow); }
  .scorebar { width: 100%; max-width: 420px; display: flex; justify-content: space-between; font-family: 'Fredoka One', cursive; font-size: 16px; margin-bottom: 10px; padding: 0 4px; }
  .scorebar .label { color: #888; font-size: 12px; letter-spacing: 1px; text-transform: uppercase; }
  .scorebar .val { color: var(--orange); }
  .scorebar .val.best { color: var(--green); }
  .stage { position: relative; width: 100%; max-width: 420px; }
  canvas { display: block; width: 100%; height: auto; border: 4px solid var(--text); border-radius: 16px; box-shadow: 6px 6px 0 var(--text); background: #2b2b3d; touch-action: none; }
  .overlay { position: absolute; inset: 0; background: rgba(26,26,46,0.82); border-radius: 16px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; color: white; padding: 24px; }
  .overlay.hidden { display: none; }
  .overlay h2 { font-family: 'Fredoka One', cursive; font-size: 34px; margin-bottom: 8px; color: var(--yellow); }
  .overlay p { font-size: 15px; font-weight: 700; margin-bottom: 6px; max-width: 280px; }
  .overlay .big-score { font-family: 'Fredoka One', cursive; font-size: 40px; color: white; margin: 6px 0 10px; }
  .overlay .big-score.hidden { display: none; }
  .btn { background: var(--orange); color: white; border: 3px solid white; border-radius: 14px; padding: 12px 34px; font-family: 'Fredoka One', cursive; font-size: 20px; cursor: pointer; box-shadow: 3px 3px 0 rgba(0,0,0,0.4); }
  .btn:active { transform: translateY(2px); }
  .dpad { margin-top: 16px; display: grid; grid-template-columns: repeat(3, 64px); grid-template-rows: repeat(2, 64px); gap: 8px; }
  .dbtn { background: white; border: 4px solid var(--text); border-radius: 14px; box-shadow: 3px 3px 0 var(--text); font-size: 26px; display: flex; align-items: center; justify-content: center; cursor: pointer; touch-action: none; }
  .dbtn:active { transform: translate(2px,2px); box-shadow: 1px 1px 0 var(--text); }
  .dbtn.up { grid-column: 2; grid-row: 1; }
  .dbtn.left { grid-column: 1; grid-row: 2; }
  .dbtn.down { grid-column: 2; grid-row: 2; }
  .dbtn.right { grid-column: 3; grid-row: 2; }
  .hint { margin-top: 12px; font-size: 13px; font-weight: 700; color: #999; text-align: center; max-width: 420px; }

  /* === LEADERBOARD LAYOUT === */
  .game-wrapper { display: flex; gap: 20px; align-items: flex-start; justify-content: center; width: 100%; max-width: 660px; }
  .game-col { display: flex; flex-direction: column; align-items: center; width: 100%; max-width: 420px; }
  .lb-panel { flex: 0 0 200px; background: white; border: 4px solid var(--text); border-radius: 16px; box-shadow: 6px 6px 0 var(--text); padding: 14px 12px; margin-top: 100px; }
  .lb-panel-title { font-family: 'Fredoka One', cursive; font-size: 16px; text-align: center; margin-bottom: 10px; padding-bottom: 8px; border-bottom: 3px solid var(--text); }
  .lb-panel-title-week { margin-top: 14px; padding-top: 10px; border-top: 2px solid var(--text); border-bottom: none; padding-bottom: 6px; }
  .lb-row { display: flex; align-items: center; gap: 5px; padding: 5px 2px; border-bottom: 1px solid #f0f0f0; font-size: 12px; font-weight: 700; }
  .lb-row:last-child { border-bottom: none; }
  .lb-rank { flex: 0 0 28px; font-family: 'Fredoka One', cursive; font-size: 13px; }
  .lb-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text); }
  .lb-score { color: var(--orange); font-family: 'Fredoka One', cursive; font-size: 13px; }
  .lb-empty, .lb-loading { color: #bbb; font-size: 12px; text-align: center; padding: 20px 4px; line-height: 1.6; }
  /* Name entry inside overlay */
  .name-entry { width: 100%; text-align: center; margin: 4px 0 8px; display: none; }
  .name-entry .ne-label { font-size: 13px; color: var(--yellow); font-weight: 800; margin-bottom: 8px; }
  .name-entry input { width: 190px; padding: 8px 12px; border-radius: 10px; border: 3px solid white; font-family: 'Nunito', sans-serif; font-size: 15px; font-weight: 700; background: rgba(255,255,255,0.15); color: white; outline: none; text-align: center; display: block; margin: 0 auto 10px; }
  .name-entry input::placeholder { color: rgba(255,255,255,0.5); }
  .ne-btns { display: flex; gap: 8px; justify-content: center; }
  .ne-btn { padding: 8px 20px !important; font-size: 15px !important; line-height: 1 !important; }
  .ne-btn-skip { background: rgba(255,255,255,0.2) !important; }
  @media (max-width: 680px) {
    .game-wrapper { flex-direction: column; align-items: center; }
    .lb-panel { flex: none; width: 100%; max-width: 420px; margin-top: 16px; }
  }
</style>
</head>
<body>
<div class="game-wrapper">
  <div class="game-col">
    <div class="topbar">
      <a href="/games/" class="back-link">&larr; Games</a>
      <span class="title">Snake 🐍</span>
    </div>
    <div class="scorebar">
      <div><span class="label">Score</span> <span class="val" id="score">0</span></div>
      <div><span class="label">Best</span> <span class="val best" id="best">0</span></div>
    </div>
    <div class="stage">
      <canvas id="game" width="400" height="400"></canvas>
      <div class="overlay" id="overlay">
        <h2 id="ov-title">Snake</h2>
        <p id="ov-text">Eat the apples and grow as long as you can!</p>
        <div class="big-score hidden" id="ov-score"></div>
        <div class="name-entry" id="name-entry">
          <div class="ne-label">🏆 You made Top 10!</div>
          <input type="text" id="nm-input" maxlength="20" placeholder="Your name" autocomplete="off">
          <div class="ne-btns">
            <button class="btn ne-btn" id="nm-submit">Save</button>
            <button class="btn ne-btn ne-btn-skip" id="nm-skip">Skip</button>
          </div>
        </div>
        <button class="btn" id="startBtn">Start</button>
      </div>
    </div>
    <div class="dpad">
      <div class="dbtn up" data-dir="up">▲</div>
      <div class="dbtn left" data-dir="left">◀</div>
      <div class="dbtn down" data-dir="down">▼</div>
      <div class="dbtn right" data-dir="right">▶</div>
    </div>
    <p class="hint">Use the arrow buttons, arrow keys, W A S D, or swipe to turn.</p>
  </div>

  <div class="lb-panel">
    <div class="lb-panel-title">🏆 Daily Top 10</div>
    <div id="lb-list-daily"><div class="lb-loading">Loading…</div></div>
    <div class="lb-panel-title lb-panel-title-week">📅 Weekly Top 10</div>
    <div id="lb-list-weekly"><div class="lb-loading">Loading…</div></div>
  </div>
</div>

<script>
(function() {
  var canvas = document.getElementById('game');
  var ctx = canvas.getContext('2d');
  var COLS = 20, ROWS = 20, CELL = 20;
  var GAME_KEY = 'snake';

  var snake, dir, nextDir, food, state = 'start', score = 0;
  var best = parseInt(localStorage.getItem('snakeHighScore') || '0', 10);
  var stepMs = 140, acc = 0, lastTime = performance.now();
  document.getElementById('best').textContent = best;

  function reset() {
    snake = [{x:9,y:10},{x:8,y:10},{x:7,y:10}];
    dir = {x:1,y:0}; nextDir = {x:1,y:0};
    score = 0; stepMs = 140;
    document.getElementById('score').textContent = '0';
    placeFood();
  }

  function placeFood() {
    var ok = false;
    while (!ok) {
      food = {x: Math.floor(Math.random()*COLS), y: Math.floor(Math.random()*ROWS)};
      ok = !snake.some(function(s){ return s.x===food.x && s.y===food.y; });
    }
  }

  function startGame() {
    document.getElementById('name-entry').style.display = 'none';
    document.getElementById('startBtn').style.display = '';
    reset();
    state = 'playing';
    document.getElementById('overlay').classList.add('hidden');
  }

  function gameOver() {
    state = 'over';
    sndDie();
    if (score > best) {
      best = score;
      localStorage.setItem('snakeHighScore', String(best));
      document.getElementById('best').textContent = best;
    }
    document.getElementById('ov-title').textContent = 'Game Over';
    document.getElementById('ov-text').textContent = score >= best && score > 0 ? 'New high score! 🏆' : 'Good try! Go again?';
    var os = document.getElementById('ov-score');
    os.textContent = 'Score: ' + score; os.classList.remove('hidden');
    document.getElementById('startBtn').textContent = 'Play Again';
    document.getElementById('startBtn').style.display = 'none';
    document.getElementById('overlay').classList.remove('hidden');
    checkLeaderboard(score);
  }

  function setDir(d) {
    var map = { up:{x:0,y:-1}, down:{x:0,y:1}, left:{x:-1,y:0}, right:{x:1,y:0} };
    var nd = map[d]; if (!nd) return;
    if (nd.x === -dir.x && nd.y === -dir.y) return;
    nextDir = nd;
  }

  function step() {
    dir = nextDir;
    var head = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};
    if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) { gameOver(); return; }
    if (snake.some(function(s){ return s.x===head.x && s.y===head.y; })) { gameOver(); return; }
    snake.unshift(head);
    if (head.x === food.x && head.y === food.y) {
      score++;
      document.getElementById('score').textContent = score;
      if (stepMs > 75) stepMs -= 3;
      placeFood();
      sndEat();
    } else {
      snake.pop();
    }
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x+r, y);
    ctx.arcTo(x+w, y, x+w, y+h, r);
    ctx.arcTo(x+w, y+h, x, y+h, r);
    ctx.arcTo(x, y+h, x, y, r);
    ctx.arcTo(x, y, x+w, y, r);
    ctx.closePath();
  }

  function draw() {
    ctx.fillStyle = '#2b2b3d';
    ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.strokeStyle = 'rgba(255,255,255,0.04)';
    for (var i=1;i<COLS;i++){ ctx.beginPath(); ctx.moveTo(i*CELL,0); ctx.lineTo(i*CELL,canvas.height); ctx.stroke(); }
    for (var j=1;j<ROWS;j++){ ctx.beginPath(); ctx.moveTo(0,j*CELL); ctx.lineTo(canvas.width,j*CELL); ctx.stroke(); }
    if (food) {
      ctx.font = '18px serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText('🍎', food.x*CELL+CELL/2, food.y*CELL+CELL/2+1);
    }
    if (snake) {
      for (var k=0;k<snake.length;k++){
        var s = snake[k];
        ctx.fillStyle = k===0 ? '#04b386' : '#06D6A0';
        roundRect(s.x*CELL+1.5, s.y*CELL+1.5, CELL-3, CELL-3, 6);
        ctx.fill();
        if (k===0) {
          ctx.fillStyle = 'white';
          var cx = s.x*CELL+CELL/2, cy = s.y*CELL+CELL/2;
          ctx.beginPath(); ctx.arc(cx - 3*dir.y - (dir.x!==0?0:3) + (dir.x?3:0), cy - 3*dir.x + (dir.y?3:0), 2, 0, 7); ctx.fill();
          ctx.beginPath(); ctx.arc(cx + 3*dir.y + (dir.x?3:0), cy + 3*dir.x + (dir.y?3:0), 2, 0, 7); ctx.fill();
        }
      }
    }
  }

  function loop(now) {
    var dt = now - lastTime; lastTime = now;
    if (dt > 200) dt = 200;
    if (state === 'playing') {
      acc += dt;
      while (acc >= stepMs) { step(); acc -= stepMs; }
    }
    draw();
    requestAnimationFrame(loop);
  }

  window.addEventListener('keydown', function(e){
    var k = e.key.toLowerCase();
    if (['arrowup','arrowdown','arrowleft','arrowright',' '].indexOf(e.key.toLowerCase())>=0 || k===' ') e.preventDefault();
    if (k==='arrowup'||k==='w') setDir('up');
    else if (k==='arrowdown'||k==='s') setDir('down');
    else if (k==='arrowleft'||k==='a') setDir('left');
    else if (k==='arrowright'||k==='d') setDir('right');
    else if ((k===' '||k==='enter') && state!=='playing') startGame();
  });

  Array.prototype.forEach.call(document.querySelectorAll('.dbtn'), function(b){
    b.addEventListener('pointerdown', function(e){ e.preventDefault(); setDir(b.getAttribute('data-dir')); });
  });

  var sx=0, sy=0, swiping=false;
  canvas.addEventListener('pointerdown', function(e){ swiping=true; sx=e.clientX; sy=e.clientY; });
  canvas.addEventListener('pointerup', function(e){
    if (!swiping) return; swiping=false;
    var dx = e.clientX - sx, dy = e.clientY - sy;
    if (Math.abs(dx) < 12 && Math.abs(dy) < 12) return;
    if (Math.abs(dx) > Math.abs(dy)) setDir(dx>0?'right':'left');
    else setDir(dy>0?'down':'up');
  });

  document.getElementById('startBtn').addEventListener('click', startGame);

  // === LEADERBOARD ===
  // === AUDIO ===
  var _ac = null;
  function _ctx() {
    if (!_ac) _ac = new (window.AudioContext || window.webkitAudioContext)();
    if (_ac.state === 'suspended') _ac.resume();
    return _ac;
  }
  function playTone(freq, endFreq, dur, type, vol) {
    try {
      var c = _ctx(), o = c.createOscillator(), g = c.createGain();
      o.connect(g); g.connect(c.destination);
      o.type = type || 'sine';
      o.frequency.setValueAtTime(freq, c.currentTime);
      if (endFreq !== freq) o.frequency.linearRampToValueAtTime(endFreq, c.currentTime + dur);
      g.gain.setValueAtTime(vol || 0.2, c.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, c.currentTime + dur);
      o.start(c.currentTime); o.stop(c.currentTime + dur);
    } catch(ex) {}
  }
  function sndEat() { playTone(440, 880, 0.08, 'square', 0.2); }
  function sndDie() {
    playTone(330, 165, 0.18, 'sawtooth', 0.25);
    setTimeout(function() { playTone(165, 60, 0.28, 'sawtooth', 0.2); }, 180);
  }

  var SB_URL = 'https://pvuxvjieyhmjwhzsixuz.supabase.co';
  var SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InB2dXh2amlleWhtandoenNpeHV6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEzODUwOTUsImV4cCI6MjA5Njk2MTA5NX0.X9ZSlPpnZZyxILZC4F5JYHG3wVHXTtdyZMqhmdK2jtM';

  function sbHeaders() {
    return { 'apikey': SB_KEY, 'Authorization': 'Bearer ' + SB_KEY };
  }

  function esc(s) {
    return String(s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#x27;');
  }

  function safeEntries(d) {
    return Array.isArray(d) ? d : [];
  }

  function nyOffsetMs(date) {
    var utc = new Date(date.toLocaleString('en-US', { timeZone: 'UTC' }));
    var ny  = new Date(date.toLocaleString('en-US', { timeZone: 'America/New_York' }));
    return ny - utc;
  }

  function getDailyStartISO() {
    var now = new Date();
    var off = nyOffsetMs(now);
    var nyMs = now.getTime() + off;
    var dayStartNy = nyMs - (nyMs % 86400000);
    return new Date(dayStartNy - off).toISOString();
  }

  function getWeeklyStartISO() {
    var now = new Date();
    var off = nyOffsetMs(now);
    var nyMs = now.getTime() + off;
    var dayStartNy = nyMs - (nyMs % 86400000);
    var dow = new Intl.DateTimeFormat('en-US', { timeZone: 'America/New_York', weekday: 'short' }).format(now);
    var days = { Sun: 0, Mon: 1, Tue: 2, Wed: 3, Thu: 4, Fri: 5, Sat: 6 }[dow] || 0;
    var sunStartNy = dayStartNy - days * 86400000;
    var off2 = nyOffsetMs(new Date(sunStartNy - off));
    return new Date(sunStartNy - off2).toISOString();
  }

  function fetchBothBoards() {
    document.getElementById('lb-list-daily').innerHTML = '<div class="lb-loading">Loading…</div>';
    document.getElementById('lb-list-weekly').innerHTML = '<div class="lb-loading">Loading…</div>';
    var base = SB_URL + '/rest/v1/leaderboard?game=eq.' + GAME_KEY + '&order=score.desc&limit=10';
    return Promise.all([
      fetch(base + '&created_at=gte.' + getDailyStartISO(), { headers: sbHeaders() }).then(function(r) { return r.json(); }),
      fetch(base + '&created_at=gte.' + getWeeklyStartISO(), { headers: sbHeaders() }).then(function(r) { return r.json(); })
    ]).then(function(res) {
      renderLeaderboard(safeEntries(res[0]), 'lb-list-daily');
      renderLeaderboard(safeEntries(res[1]), 'lb-list-weekly');
    }).catch(function() {
      document.getElementById('lb-list-daily').innerHTML = '<div class="lb-empty">Could not load.</div>';
      document.getElementById('lb-list-weekly').innerHTML = '<div class="lb-empty">Could not load.</div>';
    });
  }

  function renderLeaderboard(entries, listId) {
    var list = document.getElementById(listId);
    if (!entries.length) {
      list.innerHTML = '<div class="lb-empty">No scores yet!<br>Be the first 🎮</div>';
      return;
    }
    list.innerHTML = entries.map(function(e, i) {
      var medal = i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : (i + 1) + '.';
      var safeScore = Math.floor(Number(e.score)) || 0;
      return '<div class="lb-row">' +
        '<span class="lb-rank">' + medal + '</span>' +
        '<span class="lb-name">' + esc(e.name) + '</span>' +
        '<span class="lb-score">' + safeScore + '</span>' +
        '</div>';
    }).join('');
  }

  function checkLeaderboard(finalScore) {
    if (!Number.isFinite(finalScore) || finalScore <= 0) { showStartBtn(); fetchBothBoards(); return; }
    var base = SB_URL + '/rest/v1/leaderboard?game=eq.' + GAME_KEY + '&order=score.desc&limit=10';
    Promise.all([
      fetch(base + '&created_at=gte.' + getDailyStartISO(), { headers: sbHeaders() }).then(function(r) { return r.json(); }),
      fetch(base + '&created_at=gte.' + getWeeklyStartISO(), { headers: sbHeaders() }).then(function(r) { return r.json(); })
    ]).then(function(res) {
      var daily = safeEntries(res[0]);
      var weekly = safeEntries(res[1]);
      renderLeaderboard(daily, 'lb-list-daily');
      renderLeaderboard(weekly, 'lb-list-weekly');
      var inDaily = daily.length < 10 || finalScore > daily[daily.length - 1].score;
      var inWeekly = weekly.length < 10 || finalScore > weekly[weekly.length - 1].score;
      if (inDaily || inWeekly) { showNameEntry(finalScore); } else { showStartBtn(); }
    }).catch(function() { showStartBtn(); });
  }

  function showNameEntry(finalScore) {
    var ne = document.getElementById('name-entry');
    var inp = document.getElementById('nm-input');
    ne.style.display = 'block';
    inp.value = '';
    setTimeout(function() { try { inp.focus(); } catch(ex) {} }, 100);

    function doSubmit() {
      var name = inp.value.trim().slice(0, 20) || 'Anonymous';
      ne.style.display = 'none';
      fetch(SB_URL + '/rest/v1/leaderboard', {
        method: 'POST',
        headers: Object.assign({}, sbHeaders(), { 'Content-Type': 'application/json', 'Prefer': 'return=minimal' }),
        body: JSON.stringify({ game: GAME_KEY, name: name, score: Math.floor(finalScore) })
      })
      .then(function() { return fetchBothBoards(); })
      .catch(function() {})
      .then(function() { showStartBtn(); });
    }

    document.getElementById('nm-submit').onclick = doSubmit;
    document.getElementById('nm-skip').onclick = function() {
      ne.style.display = 'none';
      showStartBtn();
      fetchBothBoards();
    };
    inp.onkeydown = function(e) { if (e.key === 'Enter') { e.preventDefault(); doSubmit(); } };
  }

  function showStartBtn() {
    document.getElementById('startBtn').style.display = '';
  }

  fetchBothBoards();
  reset();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
