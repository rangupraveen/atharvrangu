<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Block Drop 🧱</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --yellow: #FFD93D; --orange: #FF6B35; --green: #06D6A0; --blue: #4CC9F0;
    --red: #EF233C; --bg: #FFF8F0; --text: #1A1A2E;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Nunito', sans-serif; background: var(--bg); color: var(--text);
    min-height: 100vh; padding: 16px; display: flex; flex-direction: column; align-items: center;
    -webkit-user-select: none; user-select: none;
  }
  a { text-decoration: none; color: inherit; }
  .topbar { width: 100%; max-width: 360px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .back-link { font-family: 'Fredoka One', cursive; font-size: 14px; color: var(--orange); border: 3px solid var(--text); border-radius: 12px; padding: 6px 14px; background: white; box-shadow: 3px 3px 0 var(--text); }
  .title { font-family: 'Fredoka One', cursive; font-size: 20px; text-shadow: 2px 2px 0 var(--yellow); }
  .scorebar { width: 100%; max-width: 360px; display: flex; justify-content: space-between; font-family: 'Fredoka One', cursive; font-size: 15px; margin-bottom: 10px; padding: 0 4px; }
  .scorebar .label { color: #888; font-size: 11px; letter-spacing: 1px; text-transform: uppercase; }
  .scorebar .val { color: var(--orange); }
  .scorebar .val.best { color: var(--green); }
  .stage { position: relative; width: 100%; max-width: 360px; }
  canvas { display: block; width: 100%; height: auto; border: 4px solid var(--text); border-radius: 16px; box-shadow: 6px 6px 0 var(--text); background: #20202e; touch-action: none; }
  .overlay { position: absolute; inset: 0; background: rgba(26,26,46,0.85); border-radius: 16px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; color: white; padding: 24px; }
  .overlay.hidden { display: none; }
  .overlay h2 { font-family: 'Fredoka One', cursive; font-size: 32px; margin-bottom: 8px; color: var(--yellow); }
  .overlay p { font-size: 15px; font-weight: 700; margin-bottom: 6px; max-width: 260px; }
  .overlay .big-score { font-family: 'Fredoka One', cursive; font-size: 36px; color: white; margin: 6px 0 10px; }
  .overlay .big-score.hidden { display: none; }
  .btn { background: var(--orange); color: white; border: 3px solid white; border-radius: 14px; padding: 12px 30px; font-family: 'Fredoka One', cursive; font-size: 20px; cursor: pointer; box-shadow: 3px 3px 0 rgba(0,0,0,0.4); }
  .btn:active { transform: translateY(2px); }
  .controls { width: 100%; max-width: 360px; margin-top: 16px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .cbtn { background: white; border: 4px solid var(--text); border-radius: 14px; box-shadow: 3px 3px 0 var(--text); font-size: 24px; padding: 14px 0; text-align: center; cursor: pointer; touch-action: none; font-family: 'Fredoka One', cursive; }
  .cbtn:active { transform: translate(2px,2px); box-shadow: 1px 1px 0 var(--text); }
  .hint { margin-top: 12px; font-size: 13px; font-weight: 700; color: #999; text-align: center; max-width: 360px; }

  /* === LEADERBOARD LAYOUT === */
  .game-wrapper { display: flex; gap: 20px; align-items: flex-start; justify-content: center; width: 100%; max-width: 610px; }
  .game-col { display: flex; flex-direction: column; align-items: center; width: 100%; max-width: 360px; }
  .lb-panel { flex: 0 0 200px; background: white; border: 4px solid var(--text); border-radius: 16px; box-shadow: 6px 6px 0 var(--text); padding: 14px 12px; margin-top: 100px; }
  .lb-panel-title { font-family: 'Fredoka One', cursive; font-size: 16px; text-align: center; margin-bottom: 10px; padding-bottom: 8px; border-bottom: 3px solid var(--text); }
  .lb-panel-title-week { margin-top: 14px; padding-top: 10px; border-top: 2px solid var(--text); border-bottom: none; padding-bottom: 6px; }
  .lb-row { display: flex; align-items: center; gap: 5px; padding: 5px 2px; border-bottom: 1px solid #f0f0f0; font-size: 12px; font-weight: 700; }
  .lb-row:last-child { border-bottom: none; }
  .lb-rank { flex: 0 0 28px; font-family: 'Fredoka One', cursive; font-size: 13px; }
  .lb-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text); }
  .lb-score { color: var(--orange); font-family: 'Fredoka One', cursive; font-size: 13px; }
  .lb-empty, .lb-loading { color: #bbb; font-size: 12px; text-align: center; padding: 20px 4px; line-height: 1.6; }
  /* Name entry inside overlay */
  .name-entry { width: 100%; text-align: center; margin: 4px 0 8px; display: none; }
  .name-entry .ne-label { font-size: 13px; color: var(--yellow); font-weight: 800; margin-bottom: 8px; }
  .name-entry input { width: 190px; padding: 8px 12px; border-radius: 10px; border: 3px solid white; font-family: 'Nunito', sans-serif; font-size: 15px; font-weight: 700; background: rgba(255,255,255,0.15); color: white; outline: none; text-align: center; display: block; margin: 0 auto 10px; }
  .name-entry input::placeholder { color: rgba(255,255,255,0.5); }
  .ne-btns { display: flex; gap: 8px; justify-content: center; }
  .ne-btn { padding: 8px 20px !important; font-size: 15px !important; line-height: 1 !important; }
  .ne-btn-skip { background: rgba(255,255,255,0.2) !important; }
  @media (max-width: 640px) {
    .game-wrapper { flex-direction: column; align-items: center; }
    .lb-panel { flex: none; width: 100%; max-width: 360px; margin-top: 16px; }
  }
</style>
</head>
<body>
<div class="game-wrapper">
  <div class="game-col">
    <div class="topbar">
      <a href="/games/" class="back-link">&larr; Games</a>
      <span class="title">Block Drop 🧱</span>
    </div>
    <div class="scorebar">
      <div><span class="label">Score</span> <span class="val" id="score">0</span></div>
      <div><span class="label">Lines</span> <span class="val" id="lines">0</span></div>
      <div><span class="label">Best</span> <span class="val best" id="best">0</span></div>
    </div>
    <div class="stage">
      <canvas id="game" width="240" height="480"></canvas>
      <div class="overlay" id="overlay">
        <h2 id="ov-title">Block Drop</h2>
        <p id="ov-text">Stack the blocks and clear full lines!</p>
        <div class="big-score hidden" id="ov-score"></div>
        <div class="name-entry" id="name-entry">
          <div class="ne-label">🏆 You made Top 10!</div>
          <input type="text" id="nm-input" maxlength="20" placeholder="Your name" autocomplete="off">
          <div class="ne-btns">
            <button class="btn ne-btn" id="nm-submit">Save</button>
            <button class="btn ne-btn ne-btn-skip" id="nm-skip">Skip</button>
          </div>
        </div>
        <button class="btn" id="startBtn">Start</button>
      </div>
    </div>
    <div class="controls">
      <div class="cbtn" id="leftBtn">◀</div>
      <div class="cbtn" id="rotateBtn">⟳</div>
      <div class="cbtn" id="downBtn">▼</div>
      <div class="cbtn" id="rightBtn">▶</div>
    </div>
    <p class="hint">← → move · ↑ or ⟳ rotate · ↓ soft drop · Space hard drop. Use the buttons on mobile!</p>
  </div>

  <div class="lb-panel">
    <div class="lb-panel-title">🏆 Daily Top 10</div>
    <div id="lb-list-daily"><div class="lb-loading">Loading…</div></div>
    <div class="lb-panel-title lb-panel-title-week">📅 Weekly Top 10</div>
    <div id="lb-list-weekly"><div class="lb-loading">Loading…</div></div>
  </div>
</div>

<script>
(function() {
  var canvas = document.getElementById('game');
  var ctx = canvas.getContext('2d');
  var COLS = 10, ROWS = 20, CELL = 24;
  var GAME_KEY = 'blockdrop';

  var COLORS = { I:'#4CC9F0', O:'#FFD93D', T:'#7B5EA7', S:'#06D6A0', Z:'#EF233C', J:'#FF6B35', L:'#FF6B9D' };
  var SHAPES = {
    I:[[0,1],[1,1],[2,1],[3,1]], O:[[0,0],[1,0],[0,1],[1,1]], T:[[0,1],[1,1],[2,1],[1,0]],
    S:[[1,0],[2,0],[0,1],[1,1]], Z:[[0,0],[1,0],[1,1],[2,1]], J:[[0,0],[0,1],[1,1],[2,1]], L:[[2,0],[0,1],[1,1],[2,1]]
  };
  var TYPES = ['I','O','T','S','Z','J','L'];

  var grid, piece, state = 'start', score = 0, lines = 0, level = 1;
  var best = parseInt(localStorage.getItem('blockDropHighScore') || '0', 10);
  var dropMs = 700, acc = 0, lastTime = performance.now();
  document.getElementById('best').textContent = best;

  function emptyGrid() {
    var g = [];
    for (var y=0;y<ROWS;y++) g.push(new Array(COLS).fill(null));
    return g;
  }

  function newPiece() {
    var t = TYPES[Math.floor(Math.random()*TYPES.length)];
    return { type: t, cells: SHAPES[t].map(function(c){ return {x:c[0],y:c[1]}; }), ox: 3, oy: 0 };
  }

  function cellsAbs(p) {
    return p.cells.map(function(c){ return {x: c.x+p.ox, y: c.y+p.oy}; });
  }

  function collides(p) {
    return cellsAbs(p).some(function(c){
      if (c.x < 0 || c.x >= COLS || c.y >= ROWS) return true;
      if (c.y >= 0 && grid[c.y][c.x]) return true;
      return false;
    });
  }

  function rotate(p) {
    if (p.type === 'O') return p;
    var rotated = p.cells.map(function(c){ return {x:-(c.y-1)+1, y:(c.x-1)+1}; });
    var test = { type:p.type, cells:rotated, ox:p.ox, oy:p.oy };
    var kicks = [0,-1,1,-2,2];
    for (var i=0;i<kicks.length;i++) { test.ox = p.ox + kicks[i]; if (!collides(test)) return test; }
    return p;
  }

  function lockPiece() {
    cellsAbs(piece).forEach(function(c){ if (c.y>=0) grid[c.y][c.x] = COLORS[piece.type]; });
    sndLock();
    clearLines();
    piece = newPiece();
    if (collides(piece)) gameOver();
  }

  function clearLines() {
    var cleared = 0;
    for (var y=ROWS-1;y>=0;y--) {
      if (grid[y].every(function(c){ return c; })) {
        grid.splice(y,1); grid.unshift(new Array(COLS).fill(null)); cleared++; y++;
      }
    }
    if (cleared > 0) {
      var prevLevel = level;
      lines += cleared;
      score += [0,40,100,300,1200][cleared] * level;
      level = 1 + Math.floor(lines/10);
      dropMs = Math.max(120, 700 - (level-1)*60);
      document.getElementById('score').textContent = score;
      document.getElementById('lines').textContent = lines;
      sndClear(cleared);
      if (level > prevLevel) setTimeout(sndLevelUp, 280);
    }
  }

  function softDrop() {
    var test = { type:piece.type, cells:piece.cells, ox:piece.ox, oy:piece.oy+1 };
    if (collides(test)) lockPiece(); else piece.oy++;
  }

  function hardDrop() {
    while (true) {
      var test = { type:piece.type, cells:piece.cells, ox:piece.ox, oy:piece.oy+1 };
      if (collides(test)) break; piece.oy++;
    }
    lockPiece();
  }

  function move(dx) {
    var test = { type:piece.type, cells:piece.cells, ox:piece.ox+dx, oy:piece.oy };
    if (!collides(test)) piece.ox += dx;
  }

  function startGame() {
    document.getElementById('name-entry').style.display = 'none';
    document.getElementById('startBtn').style.display = '';
    grid = emptyGrid(); score = 0; lines = 0; level = 1; dropMs = 700; acc = 0;
    piece = newPiece(); state = 'playing';
    document.getElementById('score').textContent = '0';
    document.getElementById('lines').textContent = '0';
    document.getElementById('overlay').classList.add('hidden');
  }

  function gameOver() {
    state = 'over';
    sndGameOver();
    if (score > best) {
      best = score;
      localStorage.setItem('blockDropHighScore', String(best));
      document.getElementById('best').textContent = best;
    }
    document.getElementById('ov-title').textContent = 'Game Over';
    document.getElementById('ov-text').textContent = score >= best && score > 0 ? 'New high score! 🏆' : 'Nice stacking! Go again?';
    var os = document.getElementById('ov-score');
    os.textContent = 'Score: ' + score; os.classList.remove('hidden');
    document.getElementById('startBtn').textContent = 'Play Again';
    document.getElementById('startBtn').style.display = 'none';
    document.getElementById('overlay').classList.remove('hidden');
    checkLeaderboard(score);
  }

  function drawCell(x, y, color) {
    var px = x*CELL, py = y*CELL;
    ctx.fillStyle = color; ctx.fillRect(px+1, py+1, CELL-2, CELL-2);
    ctx.fillStyle = 'rgba(255,255,255,0.25)'; ctx.fillRect(px+1, py+1, CELL-2, 4);
  }

  function draw() {
    ctx.fillStyle = '#20202e'; ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.strokeStyle = 'rgba(255,255,255,0.05)';
    for (var i=1;i<COLS;i++){ ctx.beginPath(); ctx.moveTo(i*CELL,0); ctx.lineTo(i*CELL,canvas.height); ctx.stroke(); }
    for (var j=1;j<ROWS;j++){ ctx.beginPath(); ctx.moveTo(0,j*CELL); ctx.lineTo(canvas.width,j*CELL); ctx.stroke(); }
    if (grid) for (var y=0;y<ROWS;y++) for (var x=0;x<COLS;x++) if (grid[y][x]) drawCell(x,y,grid[y][x]);
    if (piece && state==='playing') cellsAbs(piece).forEach(function(c){ if (c.y>=0) drawCell(c.x,c.y,COLORS[piece.type]); });
  }

  function loop(now) {
    var dt = now - lastTime; lastTime = now;
    if (dt > 200) dt = 200;
    if (state === 'playing') { acc += dt; while (acc >= dropMs) { softDrop(); acc -= dropMs; } }
    draw();
    requestAnimationFrame(loop);
  }

  window.addEventListener('keydown', function(e){
    var k = e.key.toLowerCase();
    if (['arrowup','arrowdown','arrowleft','arrowright',' '].indexOf(k)>=0) e.preventDefault();
    if (state!=='playing') { if (k===' '||k==='enter') startGame(); return; }
    if (k==='arrowleft'||k==='a') move(-1);
    else if (k==='arrowright'||k==='d') move(1);
    else if (k==='arrowdown'||k==='s') softDrop();
    else if (k==='arrowup'||k==='w') piece = rotate(piece);
    else if (k===' ') hardDrop();
  });

  function bindTap(id, fn) {
    document.getElementById(id).addEventListener('pointerdown', function(e){ e.preventDefault(); if (state==='playing') fn(); });
  }
  bindTap('leftBtn', function(){ move(-1); });
  bindTap('rightBtn', function(){ move(1); });
  bindTap('downBtn', function(){ softDrop(); });
  bindTap('rotateBtn', function(){ piece = rotate(piece); });
  document.getElementById('startBtn').addEventListener('click', startGame);

  // === LEADERBOARD ===
  // === AUDIO ===
  var _ac = null;
  function _ctx() {
    if (!_ac) _ac = new (window.AudioContext || window.webkitAudioContext)();
    if (_ac.state === 'suspended') _ac.resume();
    return _ac;
  }
  function playTone(freq, endFreq, dur, type, vol) {
    try {
      var c = _ctx(), o = c.createOscillator(), g = c.createGain();
      o.connect(g); g.connect(c.destination);
      o.type = type || 'sine';
      o.frequency.setValueAtTime(freq, c.currentTime);
      if (endFreq !== freq) o.frequency.linearRampToValueAtTime(endFreq, c.currentTime + dur);
      g.gain.setValueAtTime(vol || 0.2, c.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, c.currentTime + dur);
      o.start(c.currentTime); o.stop(c.currentTime + dur);
    } catch(ex) {}
  }
  function sndLock() { playTone(120, 80, 0.09, 'sine', 0.3); }
  function sndClear(n) {
    if (n >= 4) {
      [523, 659, 784, 1047].forEach(function(f, i) {
        setTimeout(function() { playTone(f, f, 0.13, 'square', 0.28); }, i * 65);
      });
    } else {
      var start = [0, 330, 440, 523][n];
      playTone(start, start * 2, 0.2, 'square', 0.22);
    }
  }
  function sndLevelUp() {
    [523, 659, 784, 1047].forEach(function(f, i) {
      setTimeout(function() { playTone(f, f, 0.1, 'sine', 0.2); }, i * 70);
    });
  }
  function sndGameOver() {
    [440, 330, 220, 110].forEach(function(f, i) {
      setTimeout(function() { playTone(f, f * 0.6, 0.18, 'sawtooth', 0.22); }, i * 110);
    });
  }

  var SB_URL = 'https://pvuxvjieyhmjwhzsixuz.supabase.co';
  var SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InB2dXh2amlleWhtandoenNpeHV6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEzODUwOTUsImV4cCI6MjA5Njk2MTA5NX0.X9ZSlPpnZZyxILZC4F5JYHG3wVHXTtdyZMqhmdK2jtM';

  function sbHeaders() {
    return { 'apikey': SB_KEY, 'Authorization': 'Bearer ' + SB_KEY };
  }

  function esc(s) {
    return String(s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#x27;');
  }

  function safeEntries(d) {
    return Array.isArray(d) ? d : [];
  }

  function nyOffsetMs(date) {
    var utc = new Date(date.toLocaleString('en-US', { timeZone: 'UTC' }));
    var ny  = new Date(date.toLocaleString('en-US', { timeZone: 'America/New_York' }));
    return ny - utc;
  }

  function getDailyStartISO() {
    var now = new Date();
    var off = nyOffsetMs(now);
    var nyMs = now.getTime() + off;
    var dayStartNy = nyMs - (nyMs % 86400000);
    return new Date(dayStartNy - off).toISOString();
  }

  function getWeeklyStartISO() {
    var now = new Date();
    var off = nyOffsetMs(now);
    var nyMs = now.getTime() + off;
    var dayStartNy = nyMs - (nyMs % 86400000);
    var dow = new Intl.DateTimeFormat('en-US', { timeZone: 'America/New_York', weekday: 'short' }).format(now);
    var days = { Sun: 0, Mon: 1, Tue: 2, Wed: 3, Thu: 4, Fri: 5, Sat: 6 }[dow] || 0;
    var sunStartNy = dayStartNy - days * 86400000;
    var off2 = nyOffsetMs(new Date(sunStartNy - off));
    return new Date(sunStartNy - off2).toISOString();
  }

  function fetchBothBoards() {
    document.getElementById('lb-list-daily').innerHTML = '<div class="lb-loading">Loading…</div>';
    document.getElementById('lb-list-weekly').innerHTML = '<div class="lb-loading">Loading…</div>';
    var base = SB_URL + '/rest/v1/leaderboard?game=eq.' + GAME_KEY + '&order=score.desc&limit=10';
    return Promise.all([
      fetch(base + '&created_at=gte.' + getDailyStartISO(), { headers: sbHeaders() }).then(function(r) { return r.json(); }),
      fetch(base + '&created_at=gte.' + getWeeklyStartISO(), { headers: sbHeaders() }).then(function(r) { return r.json(); })
    ]).then(function(res) {
      renderLeaderboard(safeEntries(res[0]), 'lb-list-daily');
      renderLeaderboard(safeEntries(res[1]), 'lb-list-weekly');
    }).catch(function() {
      document.getElementById('lb-list-daily').innerHTML = '<div class="lb-empty">Could not load.</div>';
      document.getElementById('lb-list-weekly').innerHTML = '<div class="lb-empty">Could not load.</div>';
    });
  }

  function renderLeaderboard(entries, listId) {
    var list = document.getElementById(listId);
    if (!entries.length) {
      list.innerHTML = '<div class="lb-empty">No scores yet!<br>Be the first 🎮</div>';
      return;
    }
    list.innerHTML = entries.map(function(e, i) {
      var medal = i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : (i + 1) + '.';
      var safeScore = Math.floor(Number(e.score)) || 0;
      return '<div class="lb-row">' +
        '<span class="lb-rank">' + medal + '</span>' +
        '<span class="lb-name">' + esc(e.name) + '</span>' +
        '<span class="lb-score">' + safeScore + '</span>' +
        '</div>';
    }).join('');
  }

  function checkLeaderboard(finalScore) {
    if (!Number.isFinite(finalScore) || finalScore <= 0) { showStartBtn(); fetchBothBoards(); return; }
    var base = SB_URL + '/rest/v1/leaderboard?game=eq.' + GAME_KEY + '&order=score.desc&limit=10';
    Promise.all([
      fetch(base + '&created_at=gte.' + getDailyStartISO(), { headers: sbHeaders() }).then(function(r) { return r.json(); }),
      fetch(base + '&created_at=gte.' + getWeeklyStartISO(), { headers: sbHeaders() }).then(function(r) { return r.json(); })
    ]).then(function(res) {
      var daily = safeEntries(res[0]);
      var weekly = safeEntries(res[1]);
      renderLeaderboard(daily, 'lb-list-daily');
      renderLeaderboard(weekly, 'lb-list-weekly');
      var inDaily = daily.length < 10 || finalScore > daily[daily.length - 1].score;
      var inWeekly = weekly.length < 10 || finalScore > weekly[weekly.length - 1].score;
      if (inDaily || inWeekly) { showNameEntry(finalScore); } else { showStartBtn(); }
    }).catch(function() { showStartBtn(); });
  }

  function showNameEntry(finalScore) {
    var ne = document.getElementById('name-entry');
    var inp = document.getElementById('nm-input');
    ne.style.display = 'block';
    inp.value = '';
    setTimeout(function() { try { inp.focus(); } catch(ex) {} }, 100);

    function doSubmit() {
      var name = inp.value.trim().slice(0, 20) || 'Anonymous';
      ne.style.display = 'none';
      fetch(SB_URL + '/rest/v1/leaderboard', {
        method: 'POST',
        headers: Object.assign({}, sbHeaders(), { 'Content-Type': 'application/json', 'Prefer': 'return=minimal' }),
        body: JSON.stringify({ game: GAME_KEY, name: name, score: Math.floor(finalScore) })
      })
      .then(function() { return fetchBothBoards(); })
      .catch(function() {})
      .then(function() { showStartBtn(); });
    }

    document.getElementById('nm-submit').onclick = doSubmit;
    document.getElementById('nm-skip').onclick = function() {
      ne.style.display = 'none';
      showStartBtn();
      fetchBothBoards();
    };
    inp.onkeydown = function(e) { if (e.key === 'Enter') { e.preventDefault(); doSubmit(); } };
  }

  function showStartBtn() {
    document.getElementById('startBtn').style.display = '';
  }

  fetchBothBoards();
  grid = emptyGrid();
  requestAnimationFrame(loop);
})();
